spring:
  application:
    name: AgentHelper
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yaml
        namespace: f95c5f7f-d08c-4df8-bff2-8d835513e809
        group: DEFAULT_GROUP
        refresh-enabled: true
        import-check:
          enabled: true

app:
  logging:
    app-name: ${spring.application.name}
    path: ./logs
    console-enabled: true
    rolling:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
    trace:
      header-name: X-Trace-Id
      response-header-enabled: true
    access:
      enabled: true
      console-enabled: false
      log-request-parameters: true
      log-request-headers: false
      max-body-length: 1000
      exclude-path-prefixes:
        - /favicon.ico
        - /error
        - /actuator
    exception:
      console-enabled: true
    sql:
      enabled: false
      console-enabled: false
      slow-threshold-ms: 1000
      log-parameters: true
      max-sql-length: 4000
  mybatis-plus:
    enable-sql-log: false

logging:
  level:
    root: INFO
    com.spring.ai: INFO
    org.springframework.web: INFO
    com.baomidou: INFO

agent-helper:
  user:
    face:
      # 是否启用 SmartJavaAI 人脸识别登录与绑定。
      enabled: true
      # 推理设备类型，支持 CPU/GPU。
      device: CPU
      # RetinaFace 检测置信度阈值，越高越严格。
      detection-threshold: 0.85
      # RetinaFace NMS 阈值，用于去除重复框。
      nms-threshold: 0.45
      # 人脸质量阈值，低于该值不允许绑定或登录。
      quality-threshold: 0.85
      # FaceNet 相似度阈值，越高越严格。
      match-threshold: 0.80
      # 提取特征前是否裁剪人脸区域。
      crop-face: true
      # 提取特征前是否做人脸对齐。
      align: true
      # RetinaFace 模型文件路径；不填时由 SmartJavaAI 按默认逻辑加载。
      detect-model-path:
      # FaceNet 特征模型文件路径；不填时由 SmartJavaAI 按默认逻辑加载。
      rec-model-path:
