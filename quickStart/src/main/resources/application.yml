server:
  port: 8881

spring:
  application:
    name: AgentHelper
  ai:
    alibaba:
      a2a:
        server:
          version: 1.0.0
          card:
            name: a2a_data_analysis_agent
            description: SpringAi local A2A agent backed by Nacos registry
            provider:
              name: springAi
              organization: springAi
              url: http://127.0.0.1:8881
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yaml
        namespace: f95c5f7f-d08c-4df8-bff2-8d835513e809
        group: DEFAULT_GROUP
        refresh-enabled: true
        import-check:
          enabled: true
