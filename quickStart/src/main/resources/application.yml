spring:
  application:
    name: AgentHelper
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yaml
        namespace: f95c5f7f-d08c-4df8-bff2-8d835513e809
        group: DEFAULT_GROUP
        refresh-enabled: true
        import-check:
          enabled: true

app:
  logging:
    app-name: ${spring.application.name}
    path: ./logs
    console-enabled: true
    rolling:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
    trace:
      header-name: X-Trace-Id
      response-header-enabled: true
    access:
      enabled: true
      log-request-parameters: true
      log-request-headers: false
      max-body-length: 1000
      exclude-path-prefixes:
        - /favicon.ico
        - /error
        - /actuator
    sql:
      enabled: false
      slow-threshold-ms: 1000
      log-parameters: true
      max-sql-length: 4000
  mybatis-plus:
    enable-sql-log: false

logging:
  level:
    root: INFO
    com.spring.ai: INFO
    org.springframework.web: INFO
    com.baomidou: INFO
