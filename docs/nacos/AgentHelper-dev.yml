server:
  port: 8881

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent_db?rewriteBatchedStatements=true&autoReconnect=true&allowMultiQueries=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: root
    password: root
  sql:
    init:
    # schema-locations: classpath:db/schema-h2.sql
    # data-locations: classpath:db/data-h2.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 7
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

redisson:
  config: classpath:redisson.yaml
############## 软件自定义配置 ##############
app:
  checkpoint:
    type: MEMORY
    redis:
      address: redis://127.0.0.1:6379
      database: 7
      username:
      password: 123456
  websocket:
    enabled: true
    endpoint: /ws
    broker-destination-prefix: /topic
    app-destination-prefix: /app
    session-destination-prefix: /topic/session
    allowed-origin-patterns: "*"
  snowflake:
    worker-id: 1
    datacenter-id: 1
  # Base64 encoded AES key. 16/24/32 bytes after decode.
  model-secret:
    aesKey: t4f+9kQ2L7xR8sT2G5zH8A==
  logging:
    app-name: AgentHelper
    path: D:\AgentHelper-log
    console-enabled: true
    rolling:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
    trace:
      header-name: X-Trace-Id
      response-header-enabled: true
    access:
      enabled: false
      console-enabled: false
      log-request-parameters: true
      log-request-headers: false
      max-body-length: 1000
      exclude-path-prefixes:
        - /favicon.ico
        - /error
        - /actuator
    exception:
      # 是否将异常日志同步输出到控制台。排查联调问题时建议开启。
      console-enabled: true
    sql:
      enabled: false
      console-enabled: false
      slow-threshold-ms: 1000
      log-parameters: true
      max-sql-length: 4000
  user:
    face:
      # 是否启用 SmartJavaAI 人脸识别能力，false 时人脸绑定/登录不可用
      enabled: true
      # 推理设备，支持 CPU / GPU；没有 GPU 环境时保持 CPU
      device: CPU
      # RetinaFace 人脸检测置信度阈值，越高越严格
      detection-threshold: 0.85
      # RetinaFace NMS 阈值，用于过滤重复人脸框
      nms-threshold: 0.45
      # 人脸质量阈值；当前实现直接复用检测分，低于该值拒绝绑定/登录
      quality-threshold: 0.85
      # 人脸相似度阈值；建议先用 0.80，误识别高就调大，拒识高就调小
      match-threshold: 0.80
      # 提取特征前是否先裁剪人脸区域，建议保持 true
      crop-face: true
      # 提取特征前是否做人脸对齐，建议保持 true
      align: true
      # RetinaFace 检测模型路径，可填本地绝对路径
      detect-model-path: D:/models/smartjavaai/retinaface.zip
      # FaceNet 特征提取模型路径，可填本地绝对路径
      rec-model-path: D:/models/smartjavaai/face_feature.zip
  big-file:
    storage-root: ${user.dir}/data/bigfile
    max-file-size: 2147483648
    default-chunk-size: 5242880
  code-helper:
    workspace-root: ${user.dir}
    default-model-code:
    max-session-history-size: 200
    max-tool-output-length: 20000
    default-allowed-commands:
      - mvn
      - git
      - java
      - gradlew
      - ./mvnw
      - mvnw
      - cmd
      - powershell
logging:
  level:
    root: INFO
    com.spring.ai: INFO
    org.springframework.web: INFO
    com.baomidou: INFO
############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 43200
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

flowable:
  check-process-definitions: true
  database-schema-update: true
  history-level: audit
  process-definition-location-prefix: classpath*:/processes/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"
    - "**.bpmn"

