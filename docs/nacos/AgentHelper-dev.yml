server:
  port: 8881

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent_db?rewriteBatchedStatements=true&autoReconnect=true&allowMultiQueries=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: root
    password: root

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 7
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

redisson:
  config: classpath:redisson.yaml

app:
  workflow:
    checkpoint:
      type: MEMORY
      redis:
        address: redis://127.0.0.1:6379
        database: 0
        username:
        password:
